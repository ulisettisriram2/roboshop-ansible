- name: creation of ec2 instances
  hosts: local
  connection: local
  vars:
    instancetypes: [ "mongodb", "redis", "mysql", "rabbitmq" ]
    action: create
    domain_name: thorams.store
    ami_id: ami-0055977a6e828a4f4
  
  tasks:
  - name: create SGs
    amazon.aws.ec2_security_group:
      name: "sriram-{{ item }}"
      state: present
      description: "sriram-{{ item }}-SG"
      region: us-east-1
    loop: "{{ instancetypes }}"
    when: action == "create"
    register: sg_creation_output

  - name: create ec2 instances
    amazon.aws.ec2_instance:
      name: "sriram-{{ item }}"
      image_id: "{{ ami_id }}"
      instance_type: t3.micro
      security_groups:
      - sg-0692481335becb5ca
      - "sriram-{{ item }}"
      region: us-east-1
    loop: "{{ instancetypes }}"
    when: action == "create"
    register: ec2_creation_output

  - name: create R53 service and domain
    amazon.aws.route53:
      state: present
      zone: "{{ domain_name }}"
      record: " sriram-{{ item.item }}.{{ domain_name }} "
      type: A
      ttl: 1
      value: "{{ item.instances[0].private_ip_address }}"
      overwrite: true
    loop: "{{ ec2_creation_output.results }}"
    when: action == "create"
  - name: Delete R53 service and domain
    amazon.aws.route53:
      state: absent
      zone: "{{ domain_name }}"
      record: "{{ item }}.{{ domain_name }}"
      ttl: 1
      type: A
    loop: "{{ instancetypes }}"
    when: action == "delete"
  - name: Delete ec2 instances
    amazon.aws.ec2_instance:
      state: absent # must be added
      name: "sriram-{{ item }}"
      region: us-east-1
    loop: "{{ instancetypes }}"
    when: action == "delete"
  - name: delete SGs
    amazon.aws.ec2_security_group:
      name: "sriram-{{ item }}"
      state: absent
      description: "sriram-{{ item }}-SG"
      region: us-east-1
    loop: "{{ instancetypes }}"
    when: action == "delete"
    register: sg_creation_output 
